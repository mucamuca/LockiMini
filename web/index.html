<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LockiMini — tecnologia com entrega rapida</title>
    <meta name="description" content="Loja completa com catalogo, carrinho, checkout, pagamentos e estoque atualizado em tempo real." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c66f1'/><path d='M36 30h11v29h20v11H36z' fill='white'/></svg>" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Tema aplicado ANTES do React montar.
      Sem este trecho, a pagina pinta clara por um instante e so depois escurece
      quando o JavaScript carrega — o "flash branco" que incomoda de verdade
      quem usa tema escuro em ambiente sem luz. Por isso e um script inline e
      sincrono: ele precisa rodar antes da primeira pintura.
    -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('lockimini:theme');
          var escuro =
            salvo === 'dark' ||
            ((!salvo || salvo === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage bloqueado: segue no tema claro, sem quebrar a pagina */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
